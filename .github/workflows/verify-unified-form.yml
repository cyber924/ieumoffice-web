name: Verify unified form auto-fill
on:
  push:
    branches: [fix/unified-form-ai-fill]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        working-directory: web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Syntax
        working-directory: web
        run: |
          node --check src/form-autofill.js
          node --check src/main.js
          node --check api/ai.js
      - name: Unified form tests and previous regressions
        working-directory: web
        run: node --test tests/unified-form.test.mjs tests/business-report.test.mjs tests/document-map.test.mjs
      - name: Production build
        working-directory: web
        run: npm run build
