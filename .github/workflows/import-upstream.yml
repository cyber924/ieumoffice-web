name: Import IeumOffice v0.13.2 source
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/import-upstream.yml"
permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Import pinned upstream release
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/pblsketch/ieumoffice.git
          git fetch --no-tags --depth=1 upstream refs/tags/v0.13.2
          git merge --allow-unrelated-histories -X theirs --no-edit FETCH_HEAD || {
            echo "Automatic merge failed. Manual conflict review required."
            exit 1
          }
          git push origin HEAD:main
