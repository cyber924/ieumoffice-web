name: Verify MiloSoft media and HWPX features
on:
  push:
    branches: [fix/media-font-symbols-prod]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Syntax verification
        working-directory: web
        run: |
          node --check src/media-tools.js
          node --check src/editor-pro.js
          node --check src/main.js
          node --check src/docx-export.js
          node --check src/formats.js
          node --check src/table-ai.js
      - name: Media fonts and DOCX regression
        working-directory: web
        run: node --test tests/media-integration.test.mjs
      - name: Existing HWPX AI table regression
        working-directory: web
        run: node --test tests/hwpx-ai-fill.test.mjs
      - name: Production Vite build
        working-directory: web
        run: npm run build
