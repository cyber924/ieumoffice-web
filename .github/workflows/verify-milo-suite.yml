name: Verify Milo Tool Suite
on:
  push:
    branches: [feat/milo-tool-suite]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        working-directory: web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Syntax check
        working-directory: web
        run: |
          node --check src/milo-suite.js
          node --check src/milo-prompts.js
          node --check src/document-transform.js
          node --check src/company-profile.js
          node --check src/pdf-import.js
          node --check api/bizinfo.js
          node --check api/imagehub-gallery.js
          node --check api/ai.js
          node --check src/main.js
      - name: Suite and regression tests
        working-directory: web
        run: node --test tests/milo-suite.test.mjs tests/document-design-memory.test.mjs tests/universal-autofill.test.mjs tests/unified-form.test.mjs
      - name: Production build
        working-directory: web
        run: npm run build
