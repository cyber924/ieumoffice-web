name: Verify MiloSoft DOCX export
on:
  push:
    branches: [main]
    paths:
      - 'web/src/docx-export.js'
      - 'web/tests/**'
      - '.github/workflows/verify-docx.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        working-directory: web
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Install test DOM
        working-directory: web
        run: npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Verify DOCX tables
        working-directory: web
        run: node --test tests/docx-export.test.mjs
