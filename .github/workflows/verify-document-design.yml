name: Verify document design and remembered templates
on:
  push:
    branches: [feat/document-design-template-memory]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install test dependencies
        working-directory: web
        run: |
          npm install --ignore-scripts --no-audit --no-fund
          npm install --no-save --ignore-scripts --no-audit --no-fund jsdom@26.1.0
      - name: Verify syntax
        working-directory: web
        run: |
          node --check src/document-design.js
          node --check src/template-memory.js
          node --check src/cloud.js
          node --check src/main.js
          node --check api/ai.js
      - name: Test design and template memory without deployment
        working-directory: web
        run: node --test tests/document-design-memory.test.mjs tests/unified-form.test.mjs tests/universal-autofill.test.mjs tests/document-map.test.mjs
      - name: Build without deployment
        working-directory: web
        run: npm run build
